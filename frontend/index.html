<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Bud</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <span class="logo">Task Bud</span>
      <div id="header-user" class="header-user hidden">
        <span id="username-display"></span>
        <button id="logout-btn" class="btn btn-outline btn-small">Log out</button>
      </div>
    </div>
  </header>

  <!-- ---------------- Auth screen ---------------- -->
  <main id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="register">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required />

        <button type="submit" class="btn btn-solid">Log In</button>
        <p class="form-status" id="login-status"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" required />

        <label for="register-email">Email</label>
        <input type="email" id="register-email" required />

        <label for="register-password">Password</label>
        <input type="password" id="register-password" minlength="6" required />

        <button type="submit" class="btn btn-solid">Sign Up</button>
        <p class="form-status" id="register-status"></p>
      </form>
    </div>
  </main>

  <!-- ---------------- Task dashboard ---------------- -->
  <main id="app-screen" class="app-screen hidden">
    <div class="container">

      <section class="progress-card">
        <p id="progress-text" class="progress-text">0 of 0 tasks completed</p>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </section>

      <section class="task-form-card">
        <form id="task-form" class="task-form">
          <input type="text" id="task-text" placeholder="What needs doing?" required />
          <select id="task-priority">
            <option value="high">High priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="low">Low priority</option>
          </select>
          <select id="task-category">
            <option value="general" selected>General</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
          </select>
          <button type="submit" class="btn btn-solid">Add Task</button>
        </form>
      </section>

      <section class="task-list-header">
        <h2>Your Tasks</h2>
        <button id="clear-all-btn" class="btn btn-outline btn-small hidden">Clear All</button>
      </section>

      <ul id="task-list" class="task-list">
        <li class="loading">Loading tasks…</li>
      </ul>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Task Bud. Built with HTML, CSS, JS, Node/Express, PostgreSQL.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
